<div class="row">
  <div class="col-xs-12">
    <button class="btn btn-success"> new recipe</button>
  </div>
</div>


<div class="row">
  <div class="col-xs-12">
    <a class="list-group-item clearfix" *ngFor="let recipe of recipes">
      <span class="pull-left">
        <h4 class="h4-list-group-item-heading">{{ recipe.name }}</h4>
        <p class="list-group-item-text">{{recipe.description}}</p>
</span>
        <span class="pull-right">

        <img [src]="recipe.imgPath"
             alt="{{recipe.name}}"
             class="img-responsive" style="max-height: 50px">
          </span>


    </a>
    <app-recipe-item></app-recipe-item>
  </div>
</div>
